# Content-Security-Policy, caching and compression for effysocial.effybiz.in — included by the nginx server block
# and applied to `vite preview` in end-to-end tests (vite.config.js), so the policy
# production sends is the one Playwright checks. After changing it, deploy and
# reload nginx (effy_phase.sh deploy does this when this file changed).
#
# script-src  'self' only: the build has no inline scripts.
# style-src   'unsafe-inline' for the inline <style> in index.html and Landing.jsx; Google Fonts CSS (SiteRenderer loads fonts too).
# img/media   any https: — user content (landing pages, bio, brand assets, voice previews) can point anywhere.
# connect-src LiveKit Cloud for the realtime voice caller tool.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.livekit.cloud wss://*.livekit.cloud; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

# Caching. The HTML is revalidated on every load so a deploy is picked up at once
# (without this a browser could keep showing the previous release's page); hashed
# build files under /assets/ never change, so they are cached for a year.
set $effy_cache_control "no-cache";
if ($uri ~ "^/assets/") { set $effy_cache_control "public, max-age=31536000, immutable"; }
add_header Cache-Control $effy_cache_control always;

# Compression. nginx.conf turns gzip on for HTML only, so the app's JavaScript went out
# uncompressed (about 1 MB on a phone); these types compress to roughly a third.
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;
